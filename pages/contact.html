<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the Wachari team: questions, ideas and feedback.">
    <title>Wachari — Contact us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="../index.html" aria-label="Wachari home page">
        <svg class="logo__icon" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M9.25621 15.7628L26.7802 4.768C30.097 2.6872 34.4002 5.0796 34.4002 9.0052V30.9948C34.4002 34.92 30.097 37.3128 26.7802 35.232L9.25621 24.2372C6.1366 22.2796 6.1366 17.7204 9.25621 15.7628Z" fill="#4BB7FD"/>
            <path d="M30.7441 15.7628L13.2201 4.768C9.9033 2.6872 5.6001 5.0796 5.6001 9.0052V30.9948C5.6001 34.92 9.9033 37.3128 13.2201 35.232L30.7441 24.2372C33.8637 22.2796 33.8637 17.7204 30.7441 15.7628Z" fill="#7B6EF6"/>
        </svg>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
        <ul class="main-nav__list">
            <li><a href="../index.html#catalog">Movies</a></li>
            <li><a href="../index.html#catalog">TV Shows</a></li>
            <li><a href="pages/survey.html">Survey</a></li>
            <li><a href="contact.html" aria-current="page">Contact us &rarr;</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="contact" aria-labelledby="contact-title">
        <h1 id="contact-title">Contact us</h1>
        <p>
            Have a question, found a bug or have an idea for Wachari?
            We will really appreciate it if you take the time to write to us.
        </p>

        <form class="feedback-form" action="#" method="post">
            <p class="form-field">
                <label for="feedback-name">Name</label>
                <input
                        type="text"
                        id="feedback-name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        required>
            </p>

            <p class="form-field">
                <label for="feedback-email">Email</label>
                <input
                        type="email"
                        id="feedback-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
            </p>

            <p class="form-field">
                <label for="feedback-message">Message</label>
                <textarea
                        id="feedback-message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here"
                        required></textarea>
            </p>

            <p class="form-actions">
                <button type="reset">Clear</button>
                <button type="submit">Send message</button>
            </p>
        </form>

        <address class="contacts">
            Or write to us directly:
            <a href="mailto:hello@wachari.example">hello@wachari.example</a>
        </address>
    </section>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Wachari. All rights reserved.</p>
</footer>
</body>
</html>
