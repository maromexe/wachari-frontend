<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a Wachari account to track movies and get personal recommendations.">
    <title>Wachari — Sign up</title>
</head>
<body>
<header class="site-header">
    <a class="logo" href="../index.html" aria-label="Wachari home page">
        <svg class="logo__icon" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M9.25621 15.7628L26.7802 4.768C30.097 2.6872 34.4002 5.0796 34.4002 9.0052V30.9948C34.4002 34.92 30.097 37.3128 26.7802 35.232L9.25621 24.2372C6.1366 22.2796 6.1366 17.7204 9.25621 15.7628Z" fill="#4BB7FD"/>
            <path d="M30.7441 15.7628L13.2201 4.768C9.9033 2.6872 5.6001 5.0796 5.6001 9.0052V30.9948C5.6001 34.92 9.9033 37.3128 13.2201 35.232L30.7441 24.2372C33.8637 22.2796 33.8637 17.7204 30.7441 15.7628Z" fill="#7B6EF6"/>
        </svg>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
        <ul class="main-nav__list">
            <li><a href="../index.html#catalog">Movies</a></li>
            <li><a href="../index.html#catalog">TV Shows</a></li>
            <li><a href="pages/survey.html">Survey</a></li>
            <li><a href="contact.html">Contact us &rarr;</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="auth" aria-labelledby="auth-title">
        <img
                class="auth__illustration"
                src="../assets/images/login-illustration.png"
                alt="">

        <div class="auth__content">
            <h1 id="auth-title">Sign up</h1>

            <form class="auth-form" action="#" method="post">
                <p class="form-field">
                    <label class="visually-hidden" for="register-email">Email</label>

                    <svg class="form-field__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M17 20.5H7C4 20.5 2 19 2 15.5V8.5C2 5 4 3.5 7 3.5H17C20 3.5 22 5 22 8.5V15.5C22 19 20 20.5 17 20.5Z" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 9L13.87 11.5C12.84 12.32 11.15 12.32 10.12 11.5L7 9" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    
                    <input
                            type="email"
                            id="register-email"
                            name="email"
                            placeholder="Email"
                            autocomplete="email"
                            required>
                </p>

                <p class="form-field">
                    <label class="visually-hidden" for="register-password">Password</label>

                    <svg class="form-field__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M9 22H15C20 22 22 20 22 15V9C22 4 20 2 15 2H9C4 2 2 4 2 9V15C2 20 4 22 9 22Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16.28 13.6099C15.15 14.7399 13.53 15.0899 12.1 14.6399L9.50995 17.2199C9.32995 17.4099 8.95995 17.5299 8.68995 17.4899L7.48995 17.3299C7.08995 17.2799 6.72995 16.8999 6.66995 16.5099L6.50995 15.3099C6.46995 15.0499 6.59995 14.6799 6.77995 14.4899L9.35995 11.9099C8.91995 10.4799 9.25995 8.85989 10.39 7.72989C12.01 6.10989 14.65 6.10989 16.28 7.72989C17.9 9.33989 17.9 11.9799 16.28 13.6099Z" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10.4501 16.2799L9.6001 15.4199" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.3944 10.7H13.4034" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    
                    <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder="Password"
                            autocomplete="new-password"
                            minlength="8"
                            aria-describedby="register-password-hint"
                            required>
                    <small class="form-hint" id="register-password-hint">At least 8 characters</small>
                </p>

                <p class="form-field">
                    <label class="visually-hidden" for="register-password-confirm">Repeat password</label>

                    <svg class="form-field__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M9 22H15C20 22 22 20 22 15V9C22 4 20 2 15 2H9C4 2 2 4 2 9V15C2 20 4 22 9 22Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16.28 13.6099C15.15 14.7399 13.53 15.0899 12.1 14.6399L9.50995 17.2199C9.32995 17.4099 8.95995 17.5299 8.68995 17.4899L7.48995 17.3299C7.08995 17.2799 6.72995 16.8999 6.66995 16.5099L6.50995 15.3099C6.46995 15.0499 6.59995 14.6799 6.77995 14.4899L9.35995 11.9099C8.91995 10.4799 9.25995 8.85989 10.39 7.72989C12.01 6.10989 14.65 6.10989 16.28 7.72989C17.9 9.33989 17.9 11.9799 16.28 13.6099Z" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10.4501 16.2799L9.6001 15.4199" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.3944 10.7H13.4034" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    
                    <input
                            type="password"
                            id="register-password-confirm"
                            name="confirmPassword"
                            placeholder="Repeat password"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                </p>

                <p class="form-actions">
                    <button type="reset">Clear</button>
                    <button type="submit">Sign up</button>
                </p>
            </form>

            <p class="auth__switch">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Wachari. All rights reserved.</p>
</footer>
</body>
</html>
